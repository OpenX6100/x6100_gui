name: Build image
# On a tag: the release. Started by hand on any branch: a test image to try on
# a radio before the PR (Actions > Build image > Run workflow), kept for 30
# days as a download on the run's page. Branch names without "/": the
# downloads are named after the branch.
on:
  workflow_dispatch:
    inputs:
      buildroot_ref:
        description: AetherX6100Buildroot branch, tag or commit (to test with an open Buildroot PR; a release uses master)
        default: master
  push:
    # Pattern matched against refs/tags
    tags:
      - '**'           # Push events to every tag

jobs:
  build:
    runs-on: ubuntu-22.04
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: check free space
      run: |
        df -h
        pwd
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout GUI
      uses: actions/checkout@v4
      with:
        submodules: true
        path: x6100_gui

    - name: Checkout buildroot
      uses: actions/checkout@v4
      with:
        submodules: true
        repository: OpenX6100/AetherX6100Buildroot
        ref: ${{ inputs.buildroot_ref || 'master' }}
        path: AetherX6100Buildroot

    - name: Check buildroot ref
      run: |
        ref="${{ inputs.buildroot_ref || 'master' }}"
        echo "Buildroot: $ref = $(git -C AetherX6100Buildroot rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
        if [[ "${{ github.ref }}" == refs/tags/* && "$ref" != master ]]; then
          echo "A release must be built on Buildroot master, not $ref"; exit 1
        fi

    - name: Patch GUI mk
      run: |
        sed -i "s,https://github.com/OpenX6100/x6100_gui,${GITHUB_WORKSPACE}/x6100_gui,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_SITE_METHOD = git,X6100_GUI_SITE_METHOD = local,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_GIT_SUBMODULES,# X6100_GUI_GIT_SUBMODULES,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk

    # Ccache
    - name: Ccache cache files
      uses: actions/cache@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          Linux-ccache-${{ github.sha }}
          Linux-ccache-
          ${{ runner.os }}-ccache-

    # Configure
    - name: Configure
      run: |
        cd AetherX6100Buildroot && bash ./br_config.sh

    # Build
    - name: Build
      run: |
        cd AetherX6100Buildroot/build
        make lame
        make mpg123
        make libsndfile-dirclean
        make

    # Replace U-boot
    - name: Replace u-boot
      run: |
        dd if=x6100_gui/u-boot/u-boot-sunxi-with-spl.bin of=AetherX6100Buildroot/build/images/sdcard.img seek=8K bs=1 conv=notrunc

    # Compress image
    - name: Compress image
      run: |
        cd AetherX6100Buildroot/build/images
        mv sdcard.img sdcard.${{ github.ref_name }}.img
        zip sdcard.${{ github.ref_name }}.img.zip sdcard.${{ github.ref_name }}.img

    # Always keep the image as a download on the run's page: a branch run has
    # no release to attach it to, and on a tag it survives a failed Release.
    - name: Upload image
      uses: actions/upload-artifact@v4
      with:
        name: sdcard.${{ github.ref_name }}.img.zip
        path: AetherX6100Buildroot/build/images/sdcard.${{ github.ref_name }}.img.zip
        retention-days: 30

    # The GUI program before Buildroot strips it, for reading a core dump from
    # the radio (the image's copy has no symbols). Same build, so its code is
    # byte for byte the image's.
    - name: Find unstripped GUI
      if: always()
      continue-on-error: true
      run: |
        f=$(find AetherX6100Buildroot/build/build -path '*x6100*gui*' -name x6100_gui -type f -perm -u+x | head -1)
        echo "unstripped: $f"; file "$f"
        mkdir -p unstripped && cp "$f" unstripped/x6100_gui
    - name: Upload unstripped GUI
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: x6100_gui-unstripped.${{ github.ref_name }}
        path: unstripped/x6100_gui
        retention-days: 30

    # Create release
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: AetherX6100Buildroot/build/images/sdcard.${{ github.ref_name }}.img.zip
